    description: "First generation Mercedes-AMG A45 based on the W176 platform. Powered by the M133 2.0L turbocharged inline-four engine producing 381 hp and 450 Nm of torque, making it the most powerful production four-cylinder engine at the time. Paired with AMG SPEEDSHIFT 7-speed dual-clutch transmission and AMG Performance 4MATIC all-wheel drive."
