  - name: "Second Generation (W177)"
    start_year: 2019
    end_year: null
    description: "Second generation Mercedes-AMG A45 based on the W177 platform. Features the new M139 2.0L turbocharged inline-four engine with two variants: A 45 producing 387 hp and A 45 S producing 421 hp and 500 Nm. The M139 with twin-scroll turbo was the world's most powerful four-cylinder engine in serial production at launch. Paired with 8-speed AMG SPEEDSHIFT dual-clutch transmission and fully variable AMG Performance 4MATIC+ all-wheel drive."
    platform_code: "W177"
